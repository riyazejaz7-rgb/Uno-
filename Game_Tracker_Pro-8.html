<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Uno No Mercy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================= THEME VARIABLES ================= */
:root{
  --bg:#f3f5f9;--bg2:#eef1f7;--card:#ffffff;--card2:#fafbfd;
  --text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
  --line:#e2e8f0;--line2:#eef2f7;
  --a:#4f46e5;--a-hover:#4338ca;--a2:#eef2ff;--a3:#c7d2fe;
  --green:#059669;--green2:#d1fae5;
  --red:#dc2626;--red2:#fee2e2;
  --gold:#d97706;--gold2:#fef3c7;
  --silver:#64748b;--silver2:#f1f5f9;
  --bronze:#b45309;--bronze2:#fed7aa;
  --shadow-sm:0 1px 3px #0f172a0a;
  --shadow:0 4px 16px #0f172a0f;
  --shadow-lg:0 16px 40px #0f172a1a;
  --grad-a:linear-gradient(135deg,#6366f1,#8b5cf6);
  --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  --grad-green:linear-gradient(135deg,#10b981,#059669);
  --grad-red:linear-gradient(135deg,#f87171,#dc2626);
}
[data-theme="dark"]{
  --bg:#0a0e1a;--bg2:#0f1524;--card:#141b2d;--card2:#1a2338;
  --text:#f1f5f9;--muted:#94a3b8;--muted2:#64748b;
  --line:#1e293b;--line2:#1a2338;
  --a:#818cf8;--a-hover:#a5b4fc;--a2:#1e1b4b;--a3:#312e81;
  --green:#34d399;--green2:#064e3b;
  --red:#f87171;--red2:#450a0a;
  --gold:#fbbf24;--gold2:#451a03;
  --silver:#cbd5e1;--silver2:#334155;
  --bronze:#fb923c;--bronze2:#431407;
  --shadow-sm:0 1px 3px #00000040;
  --shadow:0 4px 16px #00000060;
  --shadow-lg:0 16px 40px #00000080;
  --grad-a:linear-gradient(135deg,#6366f1,#a855f7);
  --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  --grad-green:linear-gradient(135deg,#10b981,#059669);
  --grad-red:linear-gradient(135deg,#f87171,#dc2626);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1000px 500px at 10% -10%,#6366f11a,transparent 60%),
    radial-gradient(900px 500px at 100% 0%,#a855f71a,transparent 60%);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
select,input{outline:none}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:90px}

/* ================= HEADER ================= */
.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--card) 80%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;
  transition:background .3s,border-color .3s;
}
.brand{font-weight:900;font-size:19px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.brand .logo{
  width:32px;height:32px;border-radius:10px;background:var(--grad-a);
  display:grid;place-items:center;color:#fff;font-size:16px;
  box-shadow:0 6px 16px #6366f14d;
}
.top .actions{display:flex;gap:8px;align-items:center}
.iconbtn{
  width:38px;height:38px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
  transition:all .2s;color:var(--text);
}
.iconbtn:hover{background:var(--a2);border-color:var(--a3);transform:translateY(-1px)}
.iconbtn:active{transform:translateY(0)}

/* ================= LAYOUT ================= */
.wrap{padding:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;box-shadow:var(--shadow-sm);
  transition:transform .2s,box-shadow .2s,border-color .2s,background .3s;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--line2)}
.stat{position:relative;overflow:hidden}
.stat::after{
  content:"";position:absolute;top:-40%;right:-20%;width:100px;height:100px;border-radius:50%;
  background:var(--grad-a);opacity:.06;
}
.stat .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat b{font-size:28px;display:block;margin-top:6px;font-weight:800;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
.section{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.section h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.section h3{font-size:14px;margin:0;font-weight:700}

/* ================= BUTTONS ================= */
.btn{
  border:0;border-radius:11px;padding:11px 16px;background:var(--grad-a);color:#fff;
  font-weight:700;font-size:13.5px;transition:all .2s;
  box-shadow:0 4px 12px #6366f133;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px #6366f155}
.btn:active{transform:translateY(0)}
.btn.secondary{background:var(--a2);color:var(--a);box-shadow:none;border:1px solid var(--a3)}
.btn.secondary:hover{background:var(--a3)}
.btn.danger{background:var(--red2);color:var(--red);box-shadow:none;border:1px solid color-mix(in srgb,var(--red) 20%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 15%,transparent)}
.btn.green{background:var(--green2);color:var(--green);box-shadow:none;border:1px solid color-mix(in srgb,var(--green) 20%,transparent)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:9px}

/* ================= MISC ================= */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.right{margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--a2);color:var(--a);padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:700;border:1px solid var(--a3);
}
.pill.gold{background:var(--gold2);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 25%,transparent)}
.pill.green{background:var(--green2);color:var(--green);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.pill.red{background:var(--red2);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}

/* ================= NAV ================= */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0);
  transition:background .3s,border-color .3s;
}
.navin{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{
  color:var(--muted);padding:10px 4px 8px;font-size:10.5px;font-weight:600;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;
}
.nav button .ic{font-size:20px;line-height:1;transition:transform .25s}
.nav button.active{color:var(--a)}
.nav button.active .ic{transform:translateY(-2px) scale(1.1)}
.nav button.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;background:var(--grad-a);border-radius:0 0 4px 4px;
}

/* ================= TABLE ================= */
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line2);font-size:13px;text-align:left}
.table tr:last-child td{border-bottom:0}
.table th{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.table tr:hover td{background:var(--card2)}
.rank{font-weight:900;width:36px;font-size:15px}
.rank.gold{color:var(--gold)}
.rank.silver{color:var(--silver)}
.rank.bronze{color:var(--bronze)}

/* ================= EMPTY ================= */
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13.5px}
.empty .em{font-size:40px;display:block;margin-bottom:8px;opacity:.7}

/* ================= FORMS ================= */
.field{margin:12px 0}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--muted)}
.field input,.field select{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  background:var(--card2);color:var(--text);transition:all .2s;font-size:14px;
}
.field input:focus,.field select:focus{border-color:var(--a);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 15%,transparent)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{
  border:1px solid var(--line);padding:11px 12px;border-radius:11px;font-size:13px;
  display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s;
  background:var(--card2);font-weight:600;
}
.check:hover{border-color:var(--a3);background:var(--a2)}
.check input{margin:0;accent-color:var(--a);width:16px;height:16px;cursor:pointer}
.check:has(input:checked){border-color:var(--a);background:var(--a2);color:var(--a)}

/* ================= MODAL ================= */
.modal{
  position:fixed;inset:0;background:#00000080;backdrop-filter:blur(4px);
  z-index:50;display:none;align-items:flex-end;animation:fade .2s;
}
.modal.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(700px,100%);max-height:94vh;overflow:auto;
  background:var(--card);border-radius:24px 24px 0 0;padding:22px;
  animation:slideUp .35s cubic-bezier(.2,.9,.3,1);
  border-top:1px solid var(--line);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h2{margin:2px 0 18px;font-size:20px;font-weight:800;letter-spacing:-.4px}

/* ================= PLACES ================= */
.place{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin:8px 0}
.place .num{
  font-weight:900;text-align:center;font-size:14px;
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:var(--a2);color:var(--a);
}
.place .num.g1{background:var(--grad-gold);color:#fff;box-shadow:0 4px 12px #f59e0b55}
.place .num.g2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.place .num.g3{background:linear-gradient(135deg,#fb923c,#b45309);color:#fff}
.place select{padding:11px 12px;border:1px solid var(--line);border-radius:11px;width:100%;background:var(--card2);color:var(--text);font-weight:600}

/* ================= TOAST ================= */
.toast{
  display:none;position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  z-index:80;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .3s;
}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ================= MISC UI ================= */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-a);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.medal{font-size:24px}
.kpi{font-size:12px;color:var(--muted);font-weight:500}
.kpi b{color:var(--text)}

/* Podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;margin:20px 0}
.pod{
  border-radius:16px;padding:14px 10px;text-align:center;color:#fff;
  box-shadow:var(--shadow);transition:transform .25s;
}
.pod:hover{transform:translateY(-3px)}
.pod .nm{font-weight:800;font-size:13px;margin-top:6px;word-break:break-word}
.pod .pt{font-size:11px;opacity:.9;font-weight:600;margin-top:2px}
.pod.p1{background:var(--grad-gold);height:110px;display:flex;flex-direction:column;justify-content:center}
.pod.p2{background:linear-gradient(135deg,#94a3b8,#64748b);height:90px;display:flex;flex-direction:column;justify-content:center}
.pod.p3{background:linear-gradient(135deg,#fb923c,#b45309);height:78px;display:flex;flex-direction:column;justify-content:center}
.pod .crown{font-size:22px}

/* ================= RESPONSIVE ================= */
@media(max-width:720px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .wrap{padding:14px}
  .grid2{grid-template-columns:1fr}
  .table th,.table td{padding:10px 6px;font-size:12px}
  .stat b{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="logo">🎮</div>
    <span>Uno No Mercy</span>
  </div>
  <div class="actions">
    <button class="iconbtn" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">🌙</button>
    <button class="iconbtn" onclick="settings()" title="Settings">⚙️</button>
    <button class="btn small" onclick="openMatch()">＋ Match</button>
  </div>
</header>
<main id="view" class="wrap"></main>
<nav class="nav"><div class="navin">
  <button data-t="home" onclick="go('home')"><span class="ic">⌂</span>Home</button>
  <button data-t="matches" onclick="go('matches')"><span class="ic">🎮</span>Matches</button>
  <button data-t="ranking" onclick="go('ranking')"><span class="ic">🏆</span>Ranking</button>
  <button data-t="players" onclick="go('players')"><span class="ic">👥</span>Players</button>
  <button data-t="stats" onclick="go('stats')"><span class="ic">📊</span>Stats</button>
</div></nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ SUPABASE (SAME) ============ */
const SUPABASE_URL = 'https://azcbpramtbjsufhcgoub.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yjqbb9kMztjEei6VW3W1zQ_mcyK8Z9g';
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const KEY='uno_no_mercy_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"matches":[],"settings":{"theme":"light"}}');
db.settings=db.settings||{};
db.settings.activePlayers=Array.isArray(db.settings.activePlayers)?db.settings.activePlayers:[];
db.settings.theme=db.settings.theme||'light';
let tab='home';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

/* ============ THEME ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', db.settings.theme);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = db.settings.theme==='dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  db.settings.theme = db.settings.theme==='dark' ? 'light' : 'dark';
  save(); applyTheme();
  toast(db.settings.theme==='dark' ? '🌙 Dark mode' : '☀️ Light mode');
}

/* ============ SYNC (SAME) ============ */
async function syncFromSupabase(){
  if(!supabaseClient) return;
  try {
    const { data: pData } = await supabaseClient.from('players').select('*');
    const { data: mData } = await supabaseClient.from('matches').select('*');
    const { data: rData } = await supabaseClient.from('match_results').select('*');
    if(pData){ db.players = pData.map(p => ({ id: p.id, name: p.name })); }
    if(mData && rData){
      db.matches = mData.map(m => {
        const res = rData.filter(r => r.match_id === m.id).map(r => ({
          playerId: r.player_id, place: Number(r.position), points: Number(r.points)
        }));
        return { id: m.id, date: m.created_at || m.played_at || new Date().toISOString(), results: res };
      });
    }
    save(); render();
  } catch(e){ console.error(e); }
}

/* ============ CORE (SAME) ============ */
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function go(t){tab=t;render()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function modal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('show')}
function pname(id){return db.players.find(p=>p.id===id)?.name||'Unknown'}
function dateKey(d){return new Date(d).toISOString().slice(0,10)}
function fmt(d){return new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function scoring(n, pos){ if (pos === n) return 0; return n - pos + 1; }
function participants(m){return m.results.map(r=>r.playerId)}
function matchesFor(filters={}){
  let ms=[...db.matches];
  if(filters.count)ms=ms.filter(m=>m.results.length===+filters.count);
  if(filters.from)ms=ms.filter(m=>dateKey(m.date)>=filters.from);
  if(filters.to)ms=ms.filter(m=>dateKey(m.date)<=filters.to);
  if(filters.players?.length)ms=ms.filter(m=>filters.players.every(id=>participants(m).includes(id)));
  return ms;
}
function calc(players=db.players,matches=db.matches){
  return players.map(p=>{
    let rows=[];matches.forEach(m=>{let r=m.results.find(x=>x.playerId===p.id);if(r)rows.push({...r,date:m.date,match:m})});
    let wins=rows.filter(r=>r.place===1).length, points=rows.reduce((a,r)=>a+r.points,0);
    let cur=0,best=0; [...rows].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{if(r.place===1){cur++;best=Math.max(best,cur)}else cur=0});
    let streak=0;[...rows].sort((a,b)=>b.date.localeCompare(a.date)).forEach((r,i)=>{if(i===streak&&r.place===1)streak++;});
    return {...p,matches:rows.length,points,wins,first:wins,second:rows.filter(r=>r.place===2).length,third:rows.filter(r=>r.place===3).length,
      podium:rows.filter(r=>r.place<=3).length,avg:rows.length?points/rows.length:0,winRate:rows.length?wins/rows.length*100:0,
      podiumRate:rows.length?rows.filter(r=>r.place<=3).length/rows.length*100:0,bestStreak:best,currentStreak:streak,
      high:rows.length?Math.max(...rows.map(r=>r.points)):0,rows};
  }).sort((a,b)=>b.points-a.points||b.wins-a.wins||b.avg-a.avg);
}
function periodMatches(period){
  let now=new Date(), from=null,to=dateKey(now);
  if(period==='today')from=to;
  if(period==='7')from=dateKey(new Date(now-6*86400000));
  if(period==='30')from=dateKey(new Date(now-29*86400000));
  if(period==='month'){from=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10)}
  if(period==='year'){from=new Date(now.getFullYear(),0,1).toISOString().slice(0,10)}
  return matchesFor({from,to});
}

/* ============ RENDER ============ */
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===tab));
  document.getElementById('view').innerHTML=
    tab==='home'?home():
    tab==='matches'?matchesPage():
    tab==='ranking'?rankingPage():
    tab==='players'?playersPage():statsPage();
  if(tab==='ranking') setTimeout(rankRender,0);
}

function home(){
  let s=calc(),tm=periodMatches('today'),today=calc(db.players,tm), top=today[0], leader=s[0];
  let podium = s.slice(0,3);
  return `<div class="grid">
    <div class="card stat"><span class="lbl">Matches</span><b>${db.matches.length}</b></div>
    <div class="card stat"><span class="lbl">Players</span><b>${db.players.length}</b></div>
    <div class="card stat"><span class="lbl">Today</span><b>${tm.length}</b></div>
    <div class="card stat"><span class="lbl">Today's pts</span><b>${today.reduce((a,p)=>a+p.points,0)}</b></div>
  </div>
  ${podium.length>=3 ? `
  <div class="section"><h2>🏆 Top Players</h2></div>
  <div class="podium">
    <div class="pod p2"><div class="crown">🥈</div><div class="nm">${esc(podium[1].name)}</div><div class="pt">${podium[1].points} pts</div></div>
    <div class="pod p1"><div class="crown">👑</div><div class="nm">${esc(podium[0].name)}</div><div class="pt">${podium[0].points} pts</div></div>
    <div class="pod p3"><div class="crown">🥉</div><div class="nm">${esc(podium[2].name)}</div><div class="pt">${podium[2].points} pts</div></div>
  </div>` : leader ? `
  <div class="section"><h2>🏆 Current Leader</h2></div>
  <div class="card"><div class="row"><span class="medal">👑</span><div><b>${esc(leader.name)}</b><div class="muted">${leader.points} pts · ${leader.wins} wins · ${leader.matches} matches</div></div></div></div>` : `
  <div class="card" style="margin-top:16px"><div style="font-size:38px;text-align:center">👋</div><h3 style="margin:10px 0 6px;text-align:center">Welcome to Uno No Mercy!</h3><div class="muted" style="text-align:center">Add your players once, then select who is present for each match.</div></div>`}
  <div class="card" style="margin-top:14px">
    <div class="row"><div><b>⚡ Quick Actions</b><div class="muted">Add more players anytime or start the next match.</div></div></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="openPlayer()">＋ Add Player</button>
      <button class="btn secondary" onclick="go('players')">👥 Select Players</button>
      <button class="btn secondary" onclick="startActiveMatch()">🎮 Add Match</button>
    </div>
  </div>
  <div class="section"><h2>☀️ Today's Leader</h2></div>
  ${top&&top.matches?`<div class="card"><b>${esc(top.name)}</b> <span class="pill green">${top.points} pts</span> <span class="pill">${top.wins} wins</span></div>`:`<div class="card empty"><span class="em">🎲</span>No match played today.</div>`}
  <div class="section"><h2>Recent Matches</h2><button class="btn secondary small" onclick="go('matches')">View all</button></div>
  ${db.matches.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(matchCard).join('')||`<div class="card empty"><span class="em">🎮</span>No matches yet.</div>`}`;
}

function matchCard(m){
  let sorted=m.results.slice().sort((a,b)=>a.place-b.place);
  let medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
  return `<div class="card" style="margin:10px 0">
    <div class="row">
      <b>${fmt(m.date)}</b>
      <span class="right"></span>
      <span class="pill">👥 ${m.results.length}</span>
      <span class="pill gold">🏅 ${m.results.reduce((a,r)=>a+r.points,0)} pts</span>
    </div>
    <div style="margin-top:12px">${sorted.map((r,i)=>{
      let cls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line2)">
        <span style="font-size:15px;width:22px">${medals[i]||'•'}</span>
        <span class="${cls?'':''}" style="font-weight:${i===0?'800':'600'}">${esc(pname(r.playerId))}</span>
        <span class="right pill ${i===0?'gold':''}">${r.points} pt</span>
      </div>`;
    }).join('')}</div>
  </div>`;
}

function matchesPage(){
  return `<div class="section"><h2>🗓️ Match History</h2><button class="btn small" onclick="openMatch()">＋ Add Match</button></div>
  ${db.matches.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div style="margin:10px 0">${matchCard(m)}<div class="row" style="margin-top:8px;padding:0 4px"><button class="btn secondary small" onclick="editMatch('${m.id}')">✏️ Edit</button><button class="btn danger small" onclick="delMatch('${m.id}')">🗑 Delete</button></div></div>`).join('')||`<div class="card empty"><span class="em">📭</span>No matches recorded.</div>`}`;
}

function rankingPage(){
  return `<div class="section"><h2>🏆 Custom Ranking</h2></div>
  <div class="card">
    <div class="filters">
      <div><label class="muted" style="font-size:11px;font-weight:700">Players in match</label><select id="rcount" onchange="rankRender()"><option value="">All</option>${[3,4,5,6].map(n=>`<option value="${n}">${n} Players</option>`).join('')}</select></div>
      <div><label class="muted" style="font-size:11px;font-weight:700">Period</label><select id="rperiod" onchange="rankRender()"><option value="all">All time</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="month">This month</option><option value="year">This year</option><option value="custom">Custom</option></select></div>
      <div><label class="muted" style="font-size:11px;font-weight:700">Metric</label><select id="rmetric" onchange="rankRender()"><option value="points">Total Points</option><option value="wins">Wins</option><option value="avg">Average</option><option value="winRate">Win Rate</option><option value="first">1st Places</option><option value="podium">Podiums</option><option value="currentStreak">Current Streak</option><option value="matches">Matches</option></select></div>
    </div>
    <div id="customDates" style="display:none"><div class="grid2"><div class="field"><label>From</label><input type="date" id="rfrom" onchange="rankRender()"></div><div class="field"><label>To</label><input type="date" id="rto" onchange="rankRender()"></div></div></div>
    <div class="field"><label>Compare players — tick 2, 3, 4 or more names</label><div class="checkgrid">${db.players.map(p=>`<label class="check"><input type="checkbox" class="rplayer" value="${p.id}" onchange="rankRender()"> ${esc(p.name)}</label>`).join('')}</div></div>
  </div>
  <div id="rankBox"></div>
  <div class="section"><h2>⚔️ Head-to-Head</h2></div>
  <div class="card"><div class="grid2"><select id="h1">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><select id="h2">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn" style="margin-top:12px" onclick="h2h()">Compare</button><div id="h2hbox"></div></div>`;
}

function rankRender(){
  let c=document.getElementById('rcount')?.value||'', per=document.getElementById('rperiod')?.value||'all', metric=document.getElementById('rmetric')?.value||'points';
  let from='',to='';if(per==='custom'){document.getElementById('customDates').style.display='block';from=document.getElementById('rfrom').value;to=document.getElementById('rto').value}else if(per!=='all'){let ms=periodMatches(per);from=ms.length?dateKey(ms.reduce((a,m)=>a.date<m.date?a:m).date):'';to=ms.length?dateKey(ms.reduce((a,m)=>a.date>m.date?a:m).date):''}
  let ps=[...document.querySelectorAll('.rplayer:checked')].map(x=>x.value),ms=matchesFor({count:c,from,to,players:ps});
  let s=calc(db.players,ms).filter(p=>!ps.length||ps.includes(p.id));
  s.sort((a,b)=>(b[metric]-a[metric])||b.points-a.points);
  let medals=['🥇','🥈','🥉'];
  document.getElementById('rankBox').innerHTML=`<div class="section"><h2>Results</h2><span class="muted">${ms.length} matches used</span></div><div class="card"><table class="table"><thead><tr><th>#</th><th>Player</th><th>${metric==='winRate'?'Win %':metric==='avg'?'Avg':metric}</th><th>Matches</th><th>Wins</th></tr></thead><tbody>${s.map((p,i)=>`<tr><td class="rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${medals[i]||i+1}</td><td><b>${esc(p.name)}</b></td><td>${metric==='winRate'?p.winRate.toFixed(1)+'%':metric==='avg'?p.avg.toFixed(2):p[metric]}</td><td>${p.matches}</td><td>${p.wins}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No data</td></tr>'}</tbody></table></div>`;
}

function h2h(){
  let a=document.getElementById('h1').value,b=document.getElementById('h2').value;if(!a||!b||a===b)return toast('Choose two different players');
  let ms=matchesFor({players:[a,b]}),A=calc(db.players.filter(p=>p.id===a),ms)[0],B=calc(db.players.filter(p=>p.id===b),ms)[0];
  document.getElementById('h2hbox').innerHTML=`<div class="grid2" style="margin-top:14px"><div class="card" style="border-color:var(--a3)"><b>${esc(A.name)}</b><h2 style="margin:6px 0;color:var(--a)">${A.wins} wins</h2><div class="muted">${A.points} pts · avg ${A.avg.toFixed(1)}</div></div><div class="card" style="border-color:var(--a3)"><b>${esc(B.name)}</b><h2 style="margin:6px 0;color:var(--a)">${B.wins} wins</h2><div class="muted">${B.points} pts · avg ${B.avg.toFixed(1)}</div></div></div><div class="muted" style="margin-top:12px;text-align:center">${ms.length} matches together · podiums: ${A.podium} vs ${B.podium}</div>`;
}

function playersPage(){
  let active=new Set(db.settings.activePlayers||[]);
  return `<div class="section"><div><h2>👥 Players</h2><div class="muted">Tick ✓ for players present in next match.</div></div><button class="btn small" onclick="openPlayer()">＋ Player</button></div>
  <div class="card" style="margin-bottom:14px">
    <div class="row"><b>🟢 Present for next match</b><span class="right pill green">${active.size} selected</span></div>
    <div class="checkgrid" style="margin-top:12px">${db.players.map(p=>`<label class="check"><input type="checkbox" value="${p.id}" ${active.has(p.id)?'checked':''} onchange="toggleActive('${p.id}',this.checked)"> ✓ ${esc(p.name)}</label>`).join('')||'<div class="empty">No players yet.</div>'}</div>
    ${db.players.length?`<button class="btn" style="margin-top:14px;width:100%;justify-content:center" onclick="startActiveMatch()">🎮 Add Match — Start with selected</button>`:''}
  </div>
  ${db.players.map(p=>{let s=calc([p])[0];return `<div class="card" style="margin:10px 0"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${s.matches} matches · ${s.points} pts · ${s.wins} wins · ${s.winRate.toFixed(0)}% win rate</div></div><div class="right row"><button class="btn secondary small" onclick="profile('${p.id}')">Profile</button><button class="btn danger small" onclick="delPlayer('${p.id}')">×</button></div></div></div>`}).join('')}`;
}

function toggleActive(id,on){
  let a=new Set(db.settings.activePlayers||[]); on?a.add(id):a.delete(id); db.settings.activePlayers=[...a]; save();
  render();
}
function startActiveMatch(){
  let ids=db.settings.activePlayers||[]; if(ids.length<2)return toast('Tick at least 2 players who are present'); openMatch(null,ids);
}

function statsPage(){
  let s=calc(),tot=s.reduce((a,p)=>a+p.points,0);
  return `<div class="section"><h2>📊 Statistics</h2></div>
  <div class="grid">
    <div class="card stat"><span class="lbl">Total Points</span><b>${tot}</b></div>
    <div class="card stat"><span class="lbl">Total Wins</span><b>${s.reduce((a,p)=>a+p.wins,0)}</b></div>
    <div class="card stat"><span class="lbl">Avg Size</span><b>${db.matches.length?(db.matches.reduce((a,m)=>a+m.results.length,0)/db.matches.length).toFixed(1):0}</b></div>
    <div class="card stat"><span class="lbl">Best Streak</span><b>${Math.max(0,...s.map(p=>p.bestStreak))}</b></div>
  </div>
  <div class="section"><h2>📈 Player Progress</h2></div>
  <div class="card">${s.map(p=>`<div style="margin:14px 0"><div class="row"><b>${esc(p.name)}</b><span class="right pill">${p.points} pts</span></div><div class="bar" style="margin-top:8px"><i style="width:${tot?Math.max(2,p.points/tot*100):0}%"></i></div><div class="kpi" style="margin-top:6px">Avg <b>${p.avg.toFixed(2)}</b> · Win rate <b>${p.winRate.toFixed(1)}%</b> · Streak <b>${p.currentStreak}</b></div></div>`).join('')}</div>`;
}

/* ============ PLAYER ============ */
function openPlayer(id=''){
  let p=db.players.find(x=>x.id===id)||{name:''};
  modal(`<h2>${id?'Edit Player':'Add Player'}</h2><div class="field"><label>Player Name</label><input type="text" id="pname" value="${esc(p.name)}" placeholder="Enter name"></div><div class="row" style="margin-top:18px"><button class="btn" onclick="savePlayer('${id}')">💾 Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);
  setTimeout(()=>document.getElementById('pname')?.focus(),60);
}
async function savePlayer(id){
  let name=document.getElementById('pname').value.trim(); if(!name)return toast('Enter name');
  if(id){
    db.players=db.players.map(p=>p.id===id?{...p,name}:p);
    if(supabaseClient){ await supabaseClient.from('players').update({name}).eq('id',id); }
  } else {
    let newId=uid();
    db.players.push({id:newId,name});
    if(supabaseClient){ await supabaseClient.from('players').insert({id:newId,name}); }
  }
  save(); closeModal(); render(); toast('✓ Saved');
}
async function delPlayer(id){
  if(!confirm('Delete player?'))return;
  db.players=db.players.filter(p=>p.id!==id);
  if(supabaseClient){ await supabaseClient.from('players').delete().eq('id',id); }
  save(); render(); toast('Deleted');
}

/* ============ MATCH ============ */
function openMatch(mId=null, defaultIds=null){
  let m = mId ? db.matches.find(x=>x.id===mId) : null;
  let active = defaultIds || (m ? m.results.map(r=>r.playerId) : db.settings.activePlayers || []);
  let now = new Date();
  let currentLocalTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let dVal = m ? new Date(m.date).toISOString().slice(0,16) : currentLocalTime;
  modal(`<h2>${mId?'Edit Match':'Add Match'}</h2>
  <div class="field"><label>Date & Time</label><input type="datetime-local" id="mdate" value="${dVal}"></div>
  <div class="field"><label>Present players — tick ✓</label>
  <div class="checkgrid" style="margin-top:6px">${db.players.map(p=>`<label class="check"><input type="checkbox" class="mp" value="${p.id}" ${active.includes(p.id)?'checked':''} onchange="renderMatchOrder()"> ${esc(p.name)}</label>`).join('')||'No players'}</div></div>
  <div class="section" style="margin-top:16px"><h3>Finishing Order</h3><span class="muted" style="font-size:11px">Points auto-calculated</span></div>
  <div id="placesBox"></div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="saveMatch('${mId||''}')">💾 Save Match</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);
  renderMatchOrder(m ? m.results.slice().sort((a,b)=>a.place-b.place).map(r=>r.playerId) : null);
}
function renderMatchOrder(existingOrder=null){
  let ps=[...document.querySelectorAll('.mp:checked')].map(x=>x.value);
  let box=document.getElementById('placesBox');
  if(!ps.length){box.innerHTML='<div class="empty">Select at least 2 players above</div>';return;}
  let order=existingOrder||ps;
  box.innerHTML=order.map((id,i)=>{
    let cls = i===0?'g1':i===1?'g2':i===2?'g3':'';
    return `<div class="place"><div class="num ${cls}">${i+1}</div><select class="mplace" data-id="${id}">${ps.map(pid=>`<option value="${pid}" ${pid===id?'selected':''}>${esc(pname(pid))}</option>`).join('')}</select></div>`;
  }).join('');
}
async function saveMatch(mId){
  let dt=document.getElementById('mdate').value; if(!dt)return toast('Choose date');
  let selects=[...document.querySelectorAll('.mplace')];
  let ids=selects.map(s=>s.value);
  if(new Set(ids).size!==ids.length)return toast('A player cannot finish in multiple places');
  if(ids.length<2)return toast('At least 2 players needed');
  let results=ids.map((id,i)=>{ let place=i+1; return {playerId:id, place, points:scoring(ids.length,place)}; });
  let matchId=mId||uid();
  let matchObj={id:matchId, date:new Date(dt).toISOString(), results};
  if(mId){
    db.matches=db.matches.map(x=>x.id===mId?matchObj:x);
    if(supabaseClient){
      await supabaseClient.from('matches').update({created_at: matchObj.date}).eq('id',matchId);
      await supabaseClient.from('match_results').delete().eq('match_id',matchId);
      let insRes=results.map(r=>({match_id:matchId, player_id:r.playerId, position:r.place, points:r.points}));
      await supabaseClient.from('match_results').insert(insRes);
    }
  } else {
    db.matches.push(matchObj);
    if(supabaseClient){
      await supabaseClient.from('matches').insert({id:matchId, created_at: matchObj.date});
      let insRes=results.map(r=>({match_id:matchId, player_id:r.playerId, position:r.place, points:r.points}));
      await supabaseClient.from('match_results').insert(insRes);
    }
  }
  save(); closeModal(); render(); toast('✓ Match saved!');
}
function editMatch(id){ openMatch(id); }
async function delMatch(id){
  if(!confirm('Delete match?'))return;
  db.matches=db.matches.filter(m=>m.id!==id);
  if(supabaseClient){
    await supabaseClient.from('match_results').delete().eq('match_id',id);
    await supabaseClient.from('matches').delete().eq('id',id);
  }
  save(); render(); toast('Deleted');
}
function profile(id){
  let p=db.players.find(x=>x.id===id); let s=calc([p])[0];
  modal(`<h2>👤 ${esc(p.name)}</h2>
  <div class="grid" style="grid-template-columns:repeat(2,1fr)">
    <div class="card stat"><span class="lbl">Matches</span><b>${s.matches}</b></div>
    <div class="card stat"><span class="lbl">Points</span><b>${s.points}</b></div>
    <div class="card stat"><span class="lbl">Wins</span><b>${s.wins}</b></div>
    <div class="card stat"><span class="lbl">Win Rate</span><b>${s.winRate.toFixed(0)}%</b></div>
    <div class="card stat"><span class="lbl">Avg</span><b>${s.avg.toFixed(2)}</b></div>
    <div class="card stat"><span class="lbl">Best Streak</span><b>${s.bestStreak}</b></div>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="closeModal();openPlayer('${id}')">✏️ Edit</button><button class="btn secondary" onclick="closeModal()">Close</button></div>`);
}
function settings(){
  modal(`<h2>⚙️ Settings</h2>
  <div class="field"><label>Theme</label>
    <select id="sttheme" onchange="db.settings.theme=this.value;save();applyTheme()">
      <option value="light" ${db.settings.theme==='light'?'selected':''}>☀️ Light</option>
      <option value="dark" ${db.settings.theme==='dark'?'selected':''}>🌙 Dark</option>
    </select>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="muted">Data is stored locally and synced to Supabase automatically.</div>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="closeModal()">Close</button></div>`);
}

/* ============ INIT ============ */
applyTheme();
syncFromSupabase();
render();
</script>
</body>
</html>
