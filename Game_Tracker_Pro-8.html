<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Uno No Mercy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   UNO NO MERCY — PREMIUM UI
   Theme: Purple + Blue gradient
   ============================================ */

/* ================= LIGHT THEME ================= */
:root{
  --bg:#f0f2f9;
  --bg-grad-1:#e0e7ff;
  --bg-grad-2:#fce7f3;
  --bg-grad-3:#dbeafe;
  --card:#ffffff;
  --card-2:#f8fafc;
  --card-glass:rgba(255,255,255,.72);
  --text:#0f172a;
  --text-2:#1e293b;
  --muted:#64748b;
  --muted-2:#94a3b8;
  --line:#e5e9f2;
  --line-2:#eef2f8;
  --a:#6366f1;
  --a-2:#818cf8;
  --a-3:#a5b4fc;
  --a-bg:#eef2ff;
  --a-bg-2:#e0e7ff;
  --b:#3b82f6;
  --b-2:#60a5fa;
  --b-3:#93c5fd;
  --b-bg:#eff6ff;
  --green:#10b981;
  --green-bg:#d1fae5;
  --red:#ef4444;
  --red-bg:#fee2e2;
  --gold:#f59e0b;
  --gold-bg:#fef3c7;
  --silver:#94a3b8;
  --silver-bg:#f1f5f9;
  --bronze:#d97706;
  --bronze-bg:#fed7aa;
  --grad-main:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#3b82f6 100%);
  --grad-purple:linear-gradient(135deg,#8b5cf6,#6366f1);
  --grad-blue:linear-gradient(135deg,#3b82f6,#6366f1);
  --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  --grad-silver:linear-gradient(135deg,#cbd5e1,#94a3b8);
  --grad-bronze:linear-gradient(135deg,#fb923c,#d97706);
  --grad-green:linear-gradient(135deg,#34d399,#10b981);
  --grad-red:linear-gradient(135deg,#f87171,#ef4444);
  --sh-sm:0 2px 8px rgba(99,102,241,.06);
  --sh:0 8px 24px rgba(99,102,241,.10);
  --sh-lg:0 20px 48px rgba(99,102,241,.16);
  --sh-purple:0 12px 32px rgba(99,102,241,.32);
  --sh-blue:0 12px 32px rgba(59,130,246,.28);
  --r-sm:12px;
  --r:18px;
  --r-lg:24px;
  --r-xl:32px;
  --nav-h:76px;
}

[data-theme="dark"]{
  --bg:#0a0c18;
  --bg-grad-1:#1a1040;
  --bg-grad-2:#2a0f3a;
  --bg-grad-3:#0c1a3d;
  --card:#141829;
  --card-2:#1a1f33;
  --card-glass:rgba(20,24,41,.72);
  --text:#f1f5f9;
  --text-2:#e2e8f0;
  --muted:#94a3b8;
  --muted-2:#64748b;
  --line:#232842;
  --line-2:#1e2338;
  --a:#818cf8;
  --a-2:#a5b4fc;
  --a-3:#c7d2fe;
  --a-bg:#1e1b4b;
  --a-bg-2:#312e81;
  --b:#60a5fa;
  --b-2:#93c5fd;
  --b-3:#bfdbfe;
  --b-bg:#172554;
  --green:#34d399;
  --green-bg:#064e3b;
  --red:#f87171;
  --red-bg:#450a0a;
  --gold:#fbbf24;
  --gold-bg:#451a03;
  --silver:#cbd5e1;
  --silver-bg:#334155;
  --bronze:#fb923c;
  --bronze-bg:#431407;
  --sh-sm:0 2px 8px rgba(0,0,0,.4);
  --sh:0 8px 24px rgba(0,0,0,.5);
  --sh-lg:0 20px 48px rgba(0,0,0,.6);
  --sh-purple:0 12px 32px rgba(99,102,241,.4);
  --sh-blue:0 12px 32px rgba(59,130,246,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .4s ease,color .3s ease;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:-2;
  background:
    radial-gradient(circle at 15% 20%, var(--bg-grad-1) 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, var(--bg-grad-2) 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, var(--bg-grad-3) 0%, transparent 50%);
  opacity:.85;
  animation:bgFloat 20s ease-in-out infinite;
  transition:opacity .4s ease;
}
[data-theme="dark"] body::before{opacity:.5}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139,92,246,.15) 0%, transparent 25%),
    radial-gradient(circle at 80% 70%, rgba(59,130,246,.12) 0%, transparent 25%);
  animation:blobMove 25s ease-in-out infinite;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-3%,2%) scale(1.08)}
}
@keyframes blobMove{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(3%,-2%)}
  50%{transform:translate(-2%,3%)}
  75%{transform:translate(2%,2%)}
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
select,input{outline:none}

.app{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 20px);
  position:relative;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in srgb,var(--card) 75%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  transition:background .3s,border-color .3s;
}
.brand{
  font-weight:900;
  font-size:19px;
  letter-spacing:-.4px;
  display:flex;
  align-items:center;
  gap:10px;
}
.brand .logo{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--grad-main);
  display:grid;
  place-items:center;
  font-size:18px;
  box-shadow:var(--sh-purple);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{box-shadow:0 12px 32px rgba(99,102,241,.32)}
  50%{box-shadow:0 12px 40px rgba(139,92,246,.55)}
}
.top .actions{display:flex;gap:8px;align-items:center}
.iconbtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--card-2);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-size:17px;
  transition:all .25s cubic-bezier(.2,.9,.3,1.3);
  color:var(--text);
  position:relative;
  overflow:hidden;
}
.iconbtn::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--grad-main);
  opacity:0;
  transition:opacity .25s;
}
.iconbtn:hover::before{opacity:.12}
.iconbtn:hover{
  border-color:var(--a-3);
  transform:translateY(-2px) scale(1.05);
  box-shadow:var(--sh);
}
.iconbtn:active{transform:translateY(0) scale(.98)}

.wrap{padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:18px;
  box-shadow:var(--sh-sm);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.1),
             box-shadow .3s,
             border-color .3s,
             background .3s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--sh);
  border-color:var(--line-2);
}
.card.glass{
  background:var(--card-glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
}
.card.gradient{
  background:var(--grad-main);
  color:#fff;
  border:0;
  box-shadow:var(--sh-purple);
}
.card.gradient .muted{color:rgba(255,255,255,.75)}
.card.gradient .lbl{color:rgba(255,255,255,.7)}

.section{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:26px 4px 14px;
  gap:10px;
}
.section h2{
  font-size:18px;
  margin:0;
  font-weight:800;
  letter-spacing:-.3px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section h3{font-size:15px;margin:0;font-weight:700}

.muted{color:var(--muted);font-size:13px}

.stat{
  position:relative;
  overflow:hidden;
  background:var(--card);
}
.stat::before{
  content:"";
  position:absolute;
  top:-50%;
  right:-30%;
  width:140px;
  height:140px;
  border-radius:50%;
  background:var(--grad-main);
  opacity:.08;
  transition:transform .5s;
}
.stat:hover::before{transform:scale(1.3)}
.stat .lbl{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.6px;
  display:flex;
  align-items:center;
  gap:5px;
}
.stat b{
  font-size:30px;
  display:block;
  margin-top:8px;
  font-weight:800;
  letter-spacing:-1px;
  background:var(--grad-main);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:var(--grad-main);
  color:#fff;
  font-weight:700;
  font-size:13.5px;
  transition:all .25s cubic-bezier(.2,.9,.3,1.2);
  box-shadow:var(--sh-purple);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  position:relative;
  overflow:hidden;
  white-space:nowrap;
}
.btn::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  transform:translate(-50%,-50%);
  transition:width .5s,height .5s;
}
.btn:hover::before{width:300px;height:300px}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(99,102,241,.45);
}
.btn:active{transform:translateY(0) scale(.98)}

.btn.secondary{
  background:var(--a-bg);
  color:var(--a);
  box-shadow:none;
  border:1px solid var(--a-bg-2);
}
.btn.secondary:hover{
  background:var(--a-bg-2);
  box-shadow:0 8px 24px rgba(99,102,241,.15);
}
.btn.blue{
  background:var(--grad-blue);
  box-shadow:var(--sh-blue);
}
.btn.danger{
  background:var(--red-bg);
  color:var(--red);
  box-shadow:none;
  border:1px solid color-mix(in srgb,var(--red) 20%,transparent);
}
.btn.green{
  background:var(--green-bg);
  color:var(--green);
  box-shadow:none;
  border:1px solid color-mix(in srgb,var(--green) 20%,transparent);
}
.btn.small{padding:9px 14px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--a-bg);
  color:var(--a);
  padding:5px 11px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:700;
  border:1px solid var(--a-bg-2);
}
.pill.gold{background:var(--gold-bg);color:var(--gold)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--b-bg);color:var(--b)}
.pill.silver{background:var(--silver-bg);color:var(--silver)}
.pill.bronze{background:var(--bronze-bg);color:var(--bronze)}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.right{margin-left:auto}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0);
  box-shadow:0 -8px 32px rgba(0,0,0,.05);
}
.navin{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.nav button{
  color:var(--muted);
  padding:12px 4px 10px;
  font-size:10.5px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  position:relative;
  transition:all .25s;
}
.nav button .ic{
  font-size:22px;
  line-height:1;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.5);
  display:block;
}
.nav button.active{color:var(--a)}
.nav button.active .ic{
  transform:translateY(-3px) scale(1.15);
  filter:drop-shadow(0 6px 12px rgba(99,102,241,.5));
}
.nav button.active::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:3px;
  background:var(--grad-main);
  border-radius:0 0 6px 6px;
}

.table{width:100%;border-collapse:collapse;border-spacing:0}
.table th,.table td{
  padding:13px 10px;
  border-bottom:1px solid var(--line-2);
  font-size:13px;
  text-align:left;
}
.table tr:last-child td{border-bottom:0}
.table th{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.table tbody tr:hover td{background:var(--card-2)}
.rank{font-weight:900;width:44px;font-size:16px;text-align:center}
.rank.gold{color:var(--gold)}
.rank.silver{color:var(--silver)}
.rank.bronze{color:var(--bronze)}

.empty{
  text-align:center;
  padding:42px 20px;
  color:var(--muted);
  font-size:13.5px;
  font-weight:500;
}
.empty .em{
  font-size:48px;
  display:block;
  margin-bottom:12px;
  opacity:.7;
  animation:emptyFloat 3s ease-in-out infinite;
}
@keyframes emptyFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.field{margin:14px 0}
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
  color:var(--muted);
}
.field input,.field select{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:13px 15px;
  background:var(--card-2);
  color:var(--text);
  transition:all .25s;
  font-size:14px;
  font-weight:500;
}
.field input:focus,.field select:focus{
  border-color:var(--a);
  background:var(--card);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 14%,transparent);
}

.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{
  border:1.5px solid var(--line);
  padding:12px 13px;
  border-radius:12px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
  transition:all .2s;
  background:var(--card-2);
  font-weight:600;
  user-select:none;
}
.check:hover{border-color:var(--a-3);background:var(--a-bg)}
.check input{margin:0;accent-color:var(--a);width:17px;height:17px;cursor:pointer}
.check:has(input:checked){
  border-color:var(--a);
  background:var(--a-bg);
  color:var(--a);
  box-shadow:0 4px 12px rgba(99,102,241,.15);
}

.podium{
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:10px;
  align-items:end;
  margin:24px 0 16px;
  padding:0 4px;
}
.pod{
  border-radius:var(--r-lg);
  padding:18px 12px;
  text-align:center;
  color:#fff;
  box-shadow:var(--sh-lg);
  transition:transform .4s;
  position:relative;
  overflow:hidden;
  animation:podRise .6s cubic-bezier(.2,.9,.3,1.3) backwards;
}
.pod:nth-child(1){animation-delay:.15s}
.pod:nth-child(2){animation-delay:0s}
.pod:nth-child(3){animation-delay:.3s}
@keyframes podRise{
  from{opacity:0;transform:translateY(40px) scale(.85)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.pod .crown{
  font-size:26px;
  display:block;
  margin-bottom:6px;
  animation:crownBounce 2s ease-in-out infinite;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));
}
@keyframes crownBounce{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-4px) rotate(-5deg)}
}
.pod .nm{
  font-weight:800;
  font-size:13.5px;
  margin-top:6px;
  word-break:break-word;
  position:relative;
  z-index:1;
}
.pod .pt{
  font-size:11.5px;
  opacity:.95;
  font-weight:700;
  margin-top:4px;
  position:relative;
  z-index:1;
}
.pod.p1{
  background:var(--grad-gold);
  height:130px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 16px 40px rgba(245,158,11,.45);
}
.pod.p2{
  background:var(--grad-silver);
  height:105px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.pod.p3{
  background:var(--grad-bronze);
  height:92px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.bar{
  height:10px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  position:relative;
}
.bar i{
  display:block;
  height:100%;
  background:var(--grad-main);
  border-radius:99px;
  transition:width .8s cubic-bezier(.2,.9,.3,1.2);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(700px,100%);
  max-height:94vh;
  overflow:auto;
  background:var(--card);
  border-radius:28px 28px 0 0;
  padding:24px 22px;
  animation:slideUp .4s cubic-bezier(.2,.9,.3,1.1);
  border-top:1px solid var(--line);
  box-shadow:0 -20px 60px rgba(0,0,0,.2);
}
@keyframes slideUp{
  from{transform:translateY(60px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}
.sheet h2{
  margin:2px 0 18px;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.4px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sheet::before{
  content:"";
  display:block;
  width:44px;
  height:5px;
  background:var(--line);
  border-radius:99px;
  margin:-8px auto 16px;
}

.place{
  display:grid;
  grid-template-columns:46px 1fr;
  gap:10px;
  align-items:center;
  margin:9px 0;
}
.place .num{
  font-weight:900;
  text-align:center;
  font-size:14px;
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--a-bg);
  color:var(--a);
}
.place .num.g1{background:var(--grad-gold);color:#fff;transform:scale(1.05)}
.place .num.g2{background:var(--grad-silver);color:#fff}
.place .num.g3{background:var(--grad-bronze);color:#fff}
.place select{
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  width:100%;
  background:var(--card-2);
  color:var(--text);
  font-weight:600;
}

.toast{
  display:none;
  position:fixed;
  bottom:96px;
  left:50%;
  transform:translateX(-50%);
  z-index:80;
  background:var(--text);
  color:var(--bg);
  padding:13px 20px;
  border-radius:14px;
  font-size:13.5px;
  font-weight:700;
  box-shadow:0 20px 48px rgba(0,0,0,.3);
  animation:toastIn .35s cubic-bezier(.2,.9,.3,1.4);
  max-width:90vw;
  text-align:center;
}

      </button>
      <button data-t="ranking" onclick="go('ranking')">

      </button>

</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast"></div>

<!-- ================= JAVASCRIPT (INSIDE BODY — FIXED!) ================= -->
<script>
/* ============ SUPABASE SETUP ============ */
const SUPABASE_URL = 'https://azcbpramtbjsufhcgoub.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yjqbb9kMztjEei6VW3W1zQ_mcyK8Z9g';
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============ LOCAL DB ============ */
const KEY='uno_no_mercy_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"matches":[],"settings":{"theme":"light"}}');
db.settings=db.settings||{};
db.settings.activePlayers=Array.isArray(db.settings.activePlayers)?db.settings.activePlayers:[];
db.settings.theme=db.settings.theme||'light';
let tab='home';

/* ============ HELPERS ============ */
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

/* ============ THEME ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', db.settings.theme);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = db.settings.theme==='dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  db.settings.theme = db.settings.theme==='dark' ? 'light' : 'dark';
  save(); applyTheme();
  toast(db.settings.theme==='dark' ? '🌙 Dark mode' : '☀️ Light mode');
}

/* ============ SYNC FROM SUPABASE ============ */
async function syncFromSupabase(){
  if(!supabaseClient) return;
  try {
    const { data: pData } = await supabaseClient.from('players').select('*');
    const { data: mData } = await supabaseClient.from('matches').select('*');
    const { data: rData } = await supabaseClient.from('match_results').select('*');

    if(pData){
      db.players = pData.map(p => ({ id: p.id, name: p.name }));
    }
    if(mData && rData){
      db.matches = mData.map(m => {
        const res = rData.filter(r => r.match_id === m.id).map(r => ({
          playerId: r.player_id,
          place: Number(r.position),
          points: Number(r.points)
        }));
        return {
          id: m.id,
          date: m.created_at || m.played_at || new Date().toISOString(),
          results: res
        };
      });
    }
    save();
    render();
  } catch(e){
    console.error('Supabase sync error:', e);
  }
}

/* ============ CORE ============ */
function save(){ localStorage.setItem(KEY, JSON.stringify(db)) }

function toast(s){
  let x = document.getElementById('toast');
  x.textContent = s;
  x.style.display = 'block';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => x.style.display = 'none', 1800);
}

function go(t){ tab=t; render() }
function closeModal(){ document.getElementById('modal').classList.remove('show') }
function modal(h){
  document.getElementById('sheet').innerHTML = h;
  document.getElementById('modal').classList.add('show');
}
function pname(id){ return db.players.find(p=>p.id===id)?.name || 'Unknown' }
function dateKey(d){ return new Date(d).toISOString().slice(0,10) }
function fmt(d){
  return new Date(d).toLocaleString(undefined,{
    day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

/* ============ SCORING ============ */
function scoring(n, pos) {
  if (pos === n) return 0;
  return n - pos + 1;
}

function participants(m){ return m.results.map(r=>r.playerId) }

function matchesFor(filters={}){
  let ms = [...db.matches];
  if(filters.count) ms = ms.filter(m => m.results.length === +filters.count);
  if(filters.from) ms = ms.filter(m => dateKey(m.date) >= filters.from);
  if(filters.to) ms = ms.filter(m => dateKey(m.date) <= filters.to);
  if(filters.players?.length) ms = ms.filter(m => filters.players.every(id => participants(m).includes(id)));
  return ms;
}

/* ============ CALC ============ */
function calc(players=db.players, matches=db.matches){
  return players.map(p=>{
    let rows = [];
    matches.forEach(m => {
      let r = m.results.find(x => x.playerId === p.id);
      if(r) rows.push({ ...r, date: m.date, match: m });
    });
    let wins = rows.filter(r=>r.place===1).length;
    let points = rows.reduce((a,r)=>a+r.points, 0);

    let cur = 0, best = 0;
    [...rows].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r => {
      if(r.place===1){ cur++; best = Math.max(best, cur) } else cur = 0;
    });

    let streak = 0;
    [...rows].sort((a,b)=>b.date.localeCompare(a.date)).forEach((r,i) => {
      if(i===streak && r.place===1) streak++;
    });

    return {
      ...p,
      matches: rows.length,
      points, wins,
      first: wins,
      second: rows.filter(r=>r.place===2).length,
      third: rows.filter(r=>r.place===3).length,
      podium: rows.filter(r=>r.place<=3).length,
      avg: rows.length ? points/rows.length : 0,
      winRate: rows.length ? wins/rows.length*100 : 0,
      podiumRate: rows.length ? rows.filter(r=>r.place<=3).length/rows.length*100 : 0,
      bestStreak: best,
      currentStreak: streak,
      high: rows.length ? Math.max(...rows.map(r=>r.points)) : 0,
      rows
    };
  }).sort((a,b)=>b.points-a.points || b.wins-a.wins || b.avg-a.avg);
}

/* ============ PERIOD ============ */
function periodMatches(period){
  let now = new Date(), from = null, to = dateKey(now);
  if(period==='today') from = to;
  if(period==='7') from = dateKey(new Date(now-6*86400000));
  if(period==='30') from = dateKey(new Date(now-29*86400000));
  if(period==='month'){ from = new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10) }
  if(period==='year'){ from = new Date(now.getFullYear(),0,1).toISOString().slice(0,10) }
  return matchesFor({from, to});
}

/* ============ RENDER MAIN ============ */
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.t===tab));
  document.getElementById('view').innerHTML =
    tab==='home' ? home() :
    tab==='matches' ? matchesPage() :
    tab==='ranking' ? rankingPage() :
    tab==='players' ? playersPage() : statsPage();
  if(tab==='ranking') setTimeout(rankRender, 0);
}

/* ============ HOME PAGE ============ */
function home(){
  let s = calc();
  let tm = periodMatches('today');
  let today = calc(db.players, tm);
  let top = today[0];
  let leader = s[0];
  let podium = s.slice(0,3);

  return `
  <div class="grid">
    <div class="card stat"><span class="lbl">🎮 Matches</span><b>${db.matches.length}</b></div>
    <div class="card stat"><span class="lbl">👥 Players</span><b>${db.players.length}</b></div>
    <div class="card stat"><span class="lbl">☀️ Today</span><b>${tm.length}</b></div>
    <div class="card stat"><span class="lbl">🏅 Today's pts</span><b>${today.reduce((a,p)=>a+p.points,0)}</b></div>
  </div>

  ${podium.length>=3 ? `
    <div class="section"><h2>🏆 Top Players</h2><button class="btn secondary small" onclick="go('ranking')">View all</button></div>
    <div class="podium">
      <div class="pod p2"><span class="crown">🥈</span><div class="nm">${esc(podium[1].name)}</div><div class="pt">${podium[1].points} pts</div></div>
      <div class="pod p1"><span class="crown">👑</span><div class="nm">${esc(podium[0].name)}</div><div class="pt">${podium[0].points} pts</div></div>
      <div class="pod p3"><span class="crown">🥉</span><div class="nm">${esc(podium[2].name)}</div><div class="pt">${podium[2].points} pts</div></div>
    </div>
  ` : leader ? `
    <div class="section"><h2>🏆 Current Leader</h2></div>
    <div class="card gradient">
      <div class="row">
        <span style="font-size:32px">👑</span>
        <div>
          <b style="font-size:16px">${esc(leader.name)}</b>
          <div class="muted" style="margin-top:2px">${leader.points} pts · ${leader.wins} wins · ${leader.matches} matches</div>
        </div>
      </div>
    </div>
  ` : `
    <div class="card glass mt-3">
      <div style="font-size:44px;text-align:center">👋</div>
      <h3 style="margin:12px 0 6px;text-align:center">Welcome to Uno No Mercy!</h3>
      <div class="muted" style="text-align:center">Add your players once, then select who is present for each match.</div>
    </div>
  `}

  <div class="card mt-3">
    <div class="row">
      <div>
        <b>⚡ Quick Actions</b>
        <div class="muted" style="margin-top:2px">Start next match or add players</div>
      </div>
    </div>
    <div class="row mt-3">
      <button class="btn" onclick="openPlayer()">＋ Add Player</button>
      <button class="btn secondary" onclick="go('players')">👥 Select Players</button>
      <button class="btn blue" onclick="startActiveMatch()">🎮 Add Match</button>
    </div>
  </div>

  <div class="section"><h2>☀️ Today's Leader</h2></div>
  ${top && top.matches ? `
    <div class="card">
      <div class="row">
        <span style="font-size:26px">🥇</span>
        <div>
          <b>${esc(top.name)}</b>
          <div class="muted" style="margin-top:2px">${top.points} points · ${top.wins} wins</div>
        </div>
        <span class="right pill green">🔥 On fire</span>
      </div>
    </div>
  ` : `
    <div class="card empty"><span class="em">🎲</span>No match played today.</div>
  `}

  <div class="section">
    <h2>🕐 Recent Matches</h2>
    <button class="btn secondary small" onclick="go('matches')">View all</button>
  </div>
  ${
    db.matches.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(matchCard).join('')
    || `<div class="card empty"><span class="em">🎮</span>No matches yet.</div>`
  }
  `;
}

/* ============ MATCH CARD ============ */
function matchCard(m){
  let sorted = m.results.slice().sort((a,b)=>a.place-b.place);
  let medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣'];
  return `
  <div class="card" style="margin:10px 0">
    <div class="row">
      <b>${fmt(m.date)}</b>
      <span class="right"></span>
      <span class="pill blue">👥 ${m.results.length}</span>
      <span class="pill gold">🏅 ${m.results.reduce((a,r)=>a+r.points,0)} pts</span>
    </div>
    <div style="margin-top:12px">
      ${sorted.map((r,i)=>{
        return `
        <div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)">
          <span style="font-size:17px;width:24px;text-align:center">${medals[i]||'•'}</span>
          <span style="font-weight:${i===0?'800':'600'}">${esc(pname(r.playerId))}</span>
          <span class="right pill ${i===0?'gold':''}">${r.points} pt</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ============ MATCHES PAGE ============ */
function matchesPage(){
  let ms = db.matches.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="section">
    <h2>🗓️ Match History</h2>
    <button class="btn small" onclick="openMatch()">＋ Add Match</button>
  </div>
  ${
    ms.map(m=>`
      <div style="margin:10px 0">
        ${matchCard(m)}
        <div class="row" style="margin-top:8px;padding:0 4px">
          <button class="btn secondary small" onclick="editMatch('${m.id}')">✏️ Edit</button>
          <button class="btn danger small" onclick="delMatch('${m.id}')">🗑 Delete</button>
        </div>
      </div>
    `).join('')
    || `<div class="card empty"><span class="em">📭</span>No matches recorded.</div>`
  }`;
}

/* ============ RANKING PAGE ============ */
function rankingPage(){
  return `
  <div class="section"><h2>🏆 Custom Ranking</h2></div>
  <div class="card">
    <div class="filters">
      <div>
        <label class="muted" style="font-size:11px;font-weight:700">Players in match</label>
        <select id="rcount" onchange="rankRender()">
          <option value="">All</option>
          ${[3,4,5,6].map(n=>`<option value="${n}">${n} Players</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="muted" style="font-size:11px;font-weight:700">Period</label>
        <select id="rperiod" onchange="rankRender()">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="month">This month</option>
          <option value="year">This year</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div>
        <label class="muted" style="font-size:11px;font-weight:700">Metric</label>
        <select id="rmetric" onchange="rankRender()">
          <option value="points">Total Points</option>
          <option value="wins">Wins</option>
          <option value="avg">Average</option>
          <option value="winRate">Win Rate</option>
          <option value="first">1st Places</option>
          <option value="podium">Podiums</option>
          <option value="currentStreak">Current Streak</option>
          <option value="matches">Matches</option>
        </select>
      </div>
    </div>
    <div id="customDates" style="display:none">
      <div class="grid2">
        <div class="field"><label>From</label><input type="date" id="rfrom" onchange="rankRender()"></div>
        <div class="field"><label>To</label><input type="date" id="rto" onchange="rankRender()"></div>
      </div>
    </div>
    <div class="field">
      <label>Compare players — tick 2, 3, 4 or more names</label>
      <div class="checkgrid">
        ${db.players.map(p=>`
          <label class="check">
            <input type="checkbox" class="rplayer" value="${p.id}" onchange="rankRender()">
            ${esc(p.name)}
          </label>
        `).join('')}
      </div>
    </div>
  </div>

  <div id="rankBox"></div>

  <div class="section"><h2>⚔️ Head-to-Head</h2></div>
  <div class="card">
    <div class="grid2">
      <select id="h1">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      <select id="h2">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    </div>
    <button class="btn mt-3" onclick="h2h()">⚔️ Compare</button>
    <div id="h2hbox"></div>
  </div>`;
}

/* ============ RANK RENDER ============ */
function rankRender(){
  let c = document.getElementById('rcount')?.value || '';
  let per = document.getElementById('rperiod')?.value || 'all';
  let metric = document.getElementById('rmetric')?.value || 'points';

  let from='', to='';
  if(per==='custom'){
    document.getElementById('customDates').style.display='block';
    from = document.getElementById('rfrom').value;
    to = document.getElementById('rto').value;
  } else if(per!=='all'){
    let ms = periodMatches(per);
    from = ms.length ? dateKey(ms.reduce((a,m)=>a.date<m.date?a:m).date) : '';
    to = ms.length ? dateKey(ms.reduce((a,m)=>a.date>m.date?a:m).date) : '';
  }

  let ps = [...document.querySelectorAll('.rplayer:checked')].map(x=>x.value);
  let ms = matchesFor({count:c, from, to, players:ps});
  let s = calc(db.players, ms).filter(p => !ps.length || ps.includes(p.id));
  s.sort((a,b)=>(b[metric]-a[metric]) || b.points-a.points);

  let medals = ['🥇','🥈','🥉'];
  let metricLabel = metric==='winRate' ? 'Win %' : metric==='avg' ? 'Avg' : metric;
  let metricUp = metricLabel.charAt(0).toUpperCase() + metricLabel.slice(1);

  document.getElementById('rankBox').innerHTML = `
    <div class="section">
      <h2>📊 Results</h2>
      <span class="muted">${ms.length} matches used</span>
    </div>
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>${metricUp}</th>
            <th>Matches</th>
            <th>Wins</th>
          </tr>
        </thead>
        <tbody>
          ${
            s.map((p,i)=>{
              let cls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
              let val = metric==='winRate' ? p.winRate.toFixed(1)+'%' : metric==='avg' ? p.avg.toFixed(2) : p[metric];
              return `
              <tr>
                <td class="rank ${cls}">${medals[i] || i+1}</td>
                <td><b>${esc(p.name)}</b></td>
                <td>${val}</td>
                <td>${p.matches}</td>
                <td>${p.wins}</td>
              </tr>`;
            }).join('')
            || '<tr><td colspan="5" class="empty">No data</td></tr>'
          }
        </tbody>
      </table>
    </div>`;
}

/* ============ HEAD TO HEAD ============ */
function h2h(){
  let a = document.getElementById('h1').value;
  let b = document.getElementById('h2').value;
  if(!a || !b || a===b) return toast('Choose two different players');

  let ms = matchesFor({players:[a,b]});
  let A = calc(db.players.filter(p=>p.id===a), ms)[0];
  let B = calc(db.players.filter(p=>p.id===b), ms)[0];

  document.getElementById('h2hbox').innerHTML = `
    <div class="grid2 mt-3">
      <div class="card" style="border-color:var(--a-3)">
        <b>${esc(A.name)}</b>
        <h2 style="margin:8px 0;color:var(--a);font-size:26px;font-weight:900">${A.wins} wins</h2>
        <div class="muted">${A.points} pts · avg ${A.avg.toFixed(1)}</div>
      </div>
      <div class="card" style="border-color:var(--b-3)">
        <b>${esc(B.name)}</b>
        <h2 style="margin:8px 0;color:var(--b);font-size:26px;font-weight:900">${B.wins} wins</h2>
        <div class="muted">${B.points} pts · avg ${B.avg.toFixed(1)}</div>
      </div>
    </div>
    <div class="muted mt-3 text-center">
      ${ms.length} matches together · podiums: ${A.podium} vs ${B.podium}
    </div>`;
}

/* ============ PLAYERS PAGE ============ */
function playersPage(){
  let active = new Set(db.settings.activePlayers || []);
  return `
  <div class="section">
    <div>
      <h2>👥 Players</h2>
      <div class="muted" style="margin-top:3px">Tick ✓ for players present in next match.</div>
    </div>
    <button class="btn small" onclick="openPlayer()">＋ Player</button>
  </div>

  <div class="card mb-3">
    <div class="row">
      <b>🟢 Present for next match</b>
      <span class="right pill green">${active.size} selected</span>
    </div>
    <div class="checkgrid mt-3">
      ${
        db.players.map(p=>`
          <label class="check">
            <input type="checkbox" value="${p.id}" ${active.has(p.id)?'checked':''} onchange="toggleActive('${p.id}',this.checked)">
            ✓ ${esc(p.name)}
          </label>
        `).join('')
        || '<div class="empty">No players yet.</div>'
      }
    </div>
    ${db.players.length ? `
      <button class="btn mt-3 block" onclick="startActiveMatch()">🎮 Add Match — Start with selected</button>
    ` : ''}
  </div>

  ${db.players.map(p=>{
    let s = calc([p])[0];
    return `
    <div class="card" style="margin:10px 0">
      <div class="row">
        <div>
          <b>${esc(p.name)}</b>
          <div class="muted" style="margin-top:3px">
            ${s.matches} matches · ${s.points} pts · ${s.wins} wins · ${s.winRate.toFixed(0)}% win rate
          </div>
        </div>
        <div class="right row">
          <button class="btn secondary small" onclick="profile('${p.id}')">👤 Profile</button>
          <button class="btn danger small" onclick="delPlayer('${p.id}')">×</button>
        </div>
      </div>
    </div>`;
  }).join('')}`;
}

/* ============ TOGGLE ACTIVE ============ */
function toggleActive(id, on){
  let a = new Set(db.settings.activePlayers || []);
  on ? a.add(id) : a.delete(id);
  db.settings.activePlayers = [...a];
  save();
}

/* ============ START ACTIVE MATCH ============ */
function startActiveMatch(){
  let ids = db.settings.activePlayers || [];
  if(ids.length < 2) return toast('Tick at least 2 players who are present');
  openMatch(null, ids);
}

/* ============ STATS PAGE ============ */
function statsPage(){
  let s = calc();
  let tot = s.reduce((a,p)=>a+p.points,0);
  let avgSize = db.matches.length ? (db.matches.reduce((a,m)=>a+m.results.length,0)/db.matches.length).toFixed(1) : 0;
  let bestStreak = Math.max(0, ...s.map(p=>p.bestStreak));

  return `
  <div class="section"><h2>📊 Statistics</h2></div>
  <div class="grid">
    <div class="card stat"><span class="lbl">🏅 Total Points</span><b>${tot}</b></div>
    <div class="card stat"><span class="lbl">🏆 Total Wins</span><b>${s.reduce((a,p)=>a+p.wins,0)}</b></div>
    <div class="card stat"><span class="lbl">👥 Avg Size</span><b>${avgSize}</b></div>
    <div class="card stat"><span class="lbl">🔥 Best Streak</span><b>${bestStreak}</b></div>
  </div>

  <div class="section"><h2>📈 Player Progress</h2></div>
  <div class="card">
    ${s.map(p=>`
      <div style="margin:16px 0">
        <div class="row">
          <b>${esc(p.name)}</b>
          <span class="right pill">${p.points} pts</span>
        </div>
        <div class="bar mt-2">
          <i style="width:${tot?Math.max(2,p.points/tot*100):0}%"></i>
        </div>
        <div class="kpi mt-1">
          Avg <b>${p.avg.toFixed(2)}</b>
          <span class="dot"></span>
          Win rate <b>${p.winRate.toFixed(1)}%</b>
          <span class="dot"></span>
          Streak <b>${p.currentStreak}</b>
        </div>
      </div>
    `).join('') || '<div class="empty">No data yet.</div>'}
  </div>`;
}

/* ============ PLAYER MODAL ============ */
function openPlayer(id=''){
  let p = db.players.find(x=>x.id===id) || {name:''};
  modal(`
    <h2>${id?'✏️ Edit Player':'👤 Add Player'}</h2>
    <div class="field">
      <label>Player Name</label>
      <input type="text" id="pname" value="${esc(p.name)}" placeholder="Enter name" autocomplete="off">
    </div>
    <div class="row mt-3">
      <button class="btn" onclick="savePlayer('${id}')">💾 Save</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('pname')?.focus(), 80);
}

async function savePlayer(id){
  let name = document.getElementById('pname').value.trim();
  if(!name) return toast('Enter name');

  if(id){
    db.players = db.players.map(p => p.id===id ? {...p, name} : p);
    if(supabaseClient){ await supabaseClient.from('players').update({name}).eq('id', id); }
  } else {
    let newId = uid();
    db.players.push({id:newId, name});
    if(supabaseClient){ await supabaseClient.from('players').insert({id:newId, name}); }
  }
  save(); closeModal(); render();
  toast('✓ Saved');
}

async function delPlayer(id){
  if(!confirm('Delete player?')) return;
  db.players = db.players.filter(p=>p.id!==id);
  if(supabaseClient){ await supabaseClient.from('players').delete().eq('id', id); }
  save(); render();
  toast('🗑 Deleted');
}

/* ============ MATCH MODAL ============ */
function openMatch(mId=null, defaultIds=null){
  let m = mId ? db.matches.find(x=>x.id===mId) : null;
  let active = defaultIds || (m ? m.results.map(r=>r.playerId) : db.settings.activePlayers || []);

  let now = new Date();
  let currentLocalTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let dVal = m ? new Date(m.date).toISOString().slice(0,16) : currentLocalTime;

  modal(`
    <h2>${mId?'✏️ Edit Match':'🎮 Add Match'}</h2>
    <div class="field">
      <label>📅 Date & Time</label>
      <input type="datetime-local" id="mdate" value="${dVal}">
    </div>
    <div class="field">
      <label>👥 Present players — tick ✓</label>
      <div class="checkgrid" style="margin-top:6px">
        ${
          db.players.map(p=>`
            <label class="check">
              <input type="checkbox" class="mp" value="${p.id}" ${active.includes(p.id)?'checked':''} onchange="renderMatchOrder()">
              ${esc(p.name)}
            </label>
          `).join('')
          || '<div class="empty">No players. Add players first.</div>'
        }
      </div>
    </div>
    <div class="section" style="margin-top:16px">
      <h3>🏁 Finishing Order</h3>
      <span class="muted" style="font-size:11px">Points auto-calculated</span>
    </div>
    <div id="placesBox"></div>
    <div class="row mt-3">
      <button class="btn" onclick="saveMatch('${mId||''}')">💾 Save Match</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  `);
  renderMatchOrder(m ? m.results.slice().sort((a,b)=>a.place-b.place).map(r=>r.playerId) : null);
}

function renderMatchOrder(existingOrder=null){
  let ps = [...document.querySelectorAll('.mp:checked')].map(x=>x.value);
  let box = document.getElementById('placesBox');
  if(!ps.length){
    box.innerHTML = '<div class="empty"><span class="em">👆</span>Select at least 2 players above</div>';
    return;
  }
  let order = existingOrder && existingOrder.length===ps.length ? existingOrder : ps;
  box.innerHTML = order.map((id,i)=>{
    let cls = i===0?'g1':i===1?'g2':i===2?'g3':'';
    return `
      <div class="place">
        <div class="num ${cls}">${i+1}</div>
        <select class="mplace" data-id="${id}">
          ${ps.map(pid=>`<option value="${pid}" ${pid===id?'selected':''}>${esc(pname(pid))}</option>`).join('')}
        </select>
      </div>`;
  }).join('');
}

async function saveMatch(mId){
  let dt = document.getElementById('mdate').value;
  if(!dt) return toast('Choose date');

  let selects = [...document.querySelectorAll('.mplace')];
  let ids = selects.map(s=>s.value);
  if(new Set(ids).size !== ids.length) return toast('A player cannot finish in multiple places');
  if(ids.length < 2) return toast('At least 2 players needed');

  let results = ids.map((id,i)=>{
    let place = i+1;
    return { playerId:id, place, points: scoring(ids.length, place) };
  });

  let matchId = mId || uid();
  let matchObj = { id: matchId, date: new Date(dt).toISOString(), results };

  if(mId){
    db.matches = db.matches.map(x=>x.id===mId ? matchObj : x);
    if(supabaseClient){
      await supabaseClient.from('matches').update({created_at: matchObj.date}).eq('id', matchId);
      await supabaseClient.from('match_results').delete().eq('match_id', matchId);
      let insRes = results.map(r=>({match_id:matchId, player_id:r.playerId, position:r.place, points:r.points}));
      await supabaseClient.from('match_results').insert(insRes);
    }
  } else {
    db.matches.push(matchObj);
    if(supabaseClient){
      await supabaseClient.from('matches').insert({id:matchId, created_at: matchObj.date});
      let insRes = results.map(r=>({match_id:matchId, player_id:r.playerId, position:r.place, points:r.points}));
      await supabaseClient.from('match_results').insert(insRes);
    }
  }
  save(); closeModal(); render();
  toast('✓ Match saved!');
}

function editMatch(id){ openMatch(id); }

async function delMatch(id){
  if(!confirm('Delete match?')) return;
  db.matches = db.matches.filter(m=>m.id!==id);
  if(supabaseClient){
    await supabaseClient.from('match_results').delete().eq('match_id', id);
    await supabaseClient.from('matches').delete().eq('id', id);
  }
  save(); render();
  toast('🗑 Deleted');
}

/* ============ PROFILE MODAL ============ */
function profile(id){
  let p = db.players.find(x=>x.id===id);
  if(!p) return;
  let s = calc([p])[0];
  modal(`
    <h2>👤 ${esc(p.name)}</h2>
    <div class="grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="card stat"><span class="lbl">🎮 Matches</span><b>${s.matches}</b></div>
      <div class="card stat"><span class="lbl">🏅 Points</span><b>${s.points}</b></div>
      <div class="card stat"><span class="lbl">🏆 Wins</span><b>${s.wins}</b></div>
      <div class="card stat"><span class="lbl">📊 Win Rate</span><b>${s.winRate.toFixed(0)}%</b></div>
      <div class="card stat"><span class="lbl">📈 Avg</span><b>${s.avg.toFixed(2)}</b></div>
      <div class="card stat"><span class="lbl">🔥 Streak</span><b>${s.currentStreak}</b></div>
    </div>
    <div class="row mt-3">
      <button class="btn" onclick="closeModal(); setTimeout(()=>openPlayer('${id}'),200)">✏️ Edit</button>
      <button class="btn secondary" onclick="closeModal()">Close</button>
    </div>
  `);
}

/* ============ SETTINGS MODAL ============ */
function settings(){
  modal(`
    <h2>⚙️ Settings</h2>
    <div class="field">
      <label>🎨 Theme</label>
      <select id="sttheme" onchange="db.settings.theme=this.value;save();applyTheme()">
        <option value="light" ${db.settings.theme==='light'?'selected':''}>☀️ Light</option>
        <option value="dark" ${db.settings.theme==='dark'?'selected':''}>🌙 Dark</option>
      </select>
    </div>
    <div class="card mt-3" style="background:var(--card-2)">
      <div class="muted" style="font-size:12.5px;line-height:1.6">
        💾 Data is stored locally and synced to Supabase automatically.<br>
        🌐 Sync happens on every add / edit / delete.
      </div>
    </div>
    <div class="row mt-3">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  `);
}

/* ============ MODAL BACKDROP ============ */
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

/* ============ INIT ============ */
applyTheme();
render();
syncFromSupabase();
</script>

</body>
</html>
